[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dendrosym"
version = "0.1.0"
description = "Symbolic generator for Dendro C++ GR/NR solver code."
readme = "README.md"
license = { file = "License" }
# 3.12 is what the pins below were resolved and validated on
requires-python = ">=3.12,<3.13"
authors = [
    { name = "David Van Komen", email = "david.paralab@proton.me" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    # exact: CSE output, hence every emitted kernel, depends on the sympy version
    "sympy==1.13.3",
    "mpmath>=1.3,<1.4",
    "jinja2>=3.1",
    "numpy>=1.26",
    "dill>=0.3.8",
    "tqdm>=4.60",
    "tomlkit>=0.11.8",
]

[project.optional-dependencies]
# nxgraph.py (expression-graph decomposition and plots)
graph = ["networkx>=3.1", "matplotlib>=3.7"]
# the dendro-build CLI
build = ["GitPython>=3.1"]
gw = ["numpy-quaternion", "spherical-functions"]
cachesim = ["pycachesim"]
# cascade codegen extras: figures (liveness_viz/paperfig) and the JAX backend
cascade-figs = ["matplotlib==3.9.2", "scipy==1.15.1"]
cascade-jax = ["jax"]

[project.scripts]
dendro-build = "dendrosym.cli:main"
dendro-cascade = "dendrosym.cascade.cli:main"

[tool.setuptools.packages.find]
include = ["dendrosym*"]

[tool.setuptools.package-data]
dendrosym = [
    "templates/**/*",
    "Lebedev/**/*",
    "parameter_files/**/*",
]
